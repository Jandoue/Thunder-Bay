name: Update ship data

on:
  schedule:
    # Hourly backstop only -- same reasoning as update-flights.yml. The
    # real 5-minute cadence comes from a Cloudflare Worker; see
    # cloudflare-worker/README.md.
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-ships
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install websockets

      - name: Fetch current vessels near Thunder Bay
        working-directory: data/ships
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python fetch_ships.py

      - name: Commit and push if the data changed
        working-directory: data/ships
        run: |
          git config user.name "ship-data-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- ships_live.json; then
            echo "No change in ship data, skipping commit."
            exit 0
          fi
          git add ships_live.json
          git commit -m "Update live ship data [skip ci]"
          # update-flights.yml commits to the same branch and usually
          # finishes first (it's a ~15s job vs. this one's ~3.5min AIS
          # listen), so main has almost always moved by the time this is
          # ready to push. Rebase onto whatever's new and retry rather
          # than fail outright.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i) -- pulling and retrying..."
            git pull --rebase origin main
            sleep 2
          done
          echo "Failed to push after 5 attempts" >&2
          exit 1
