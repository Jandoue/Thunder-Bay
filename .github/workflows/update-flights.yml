name: Update flight data

on:
  schedule:
    # Hourly backstop only. The real cadence (every 5 minutes) comes from
    # a Cloudflare Worker calling workflow_dispatch on a Cron Trigger --
    # see cloudflare-worker/README.md. GitHub's own schedule: trigger
    # doesn't reliably honor a sub-hourly cron for this repo (observed
    # running 1.5-4.5+ hours apart despite a 10-minute cron), so there's
    # no point asking it for anything tighter than a safety net for when
    # the Worker itself is down.
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-flights
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch current aircraft near Thunder Bay
        working-directory: data/flights
        run: python fetch_flights.py

      - name: Commit and push if the data changed
        working-directory: data/flights
        run: |
          git config user.name "flight-data-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- flights_live.json; then
            echo "No change in flight data, skipping commit."
            exit 0
          fi
          git add flights_live.json
          git commit -m "Update live flight data [skip ci]"
          # update-ships.yml commits to the same branch and can still be
          # mid-run (its AIS listen takes ~3.5min) when this tries to
          # push, so main may have moved. Rebase onto whatever's new and
          # retry rather than fail outright.
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $i) -- pulling and retrying..."
            git pull --rebase origin main
            sleep 2
          done
          echo "Failed to push after 5 attempts" >&2
          exit 1
